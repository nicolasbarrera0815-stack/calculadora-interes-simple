<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora de Interés Simple</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }
    .card {
      background: #ffffff;
      max-width: 440px;
      width: 100%;
      padding: 24px;
      border-radius: 10px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }
    h1 { font-size: 1.4rem; margin-top: 0; color: #0f172a; }
    label { display: block; margin-top: 12px; font-weight: bold; font-size: 0.9rem; }
    input {
      width: 100%;
      padding: 9px;
      margin-top: 4px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      box-sizing: border-box;
    }
    button {
      margin-top: 18px;
      width: 100%;
      padding: 11px;
      background: #0078d4;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #005a9e; }
    .resultado {
      margin-top: 18px;
      padding: 14px;
      background: #eff6ff;
      border-left: 4px solid #0078d4;
      border-radius: 6px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Calculadora de Interés Simple</h1>
    <p>Fórmula: <strong>I = C × i × t</strong></p>

    <label for="capital">Capital inicial (C)</label>
    <input type="number" id="capital" step="any" placeholder="Ej. 1000" required />

    <label for="tasa">Tasa de interés por período (%)</label>
    <input type="number" id="tasa" step="any" placeholder="Ej. 5" required />

    <label for="tiempo">Tiempo (número de períodos, t)</label>
    <input type="number" id="tiempo" step="any" placeholder="Ej. 3" required />

    <button type="button" onclick="calcularInteres()">Calcular</button>

    <div class="resultado" id="resultado"></div>
  </div>

  <script>
    function calcularInteres() {
      const capital = parseFloat(document.getElementById("capital").value);
      const tasaPorcentaje = parseFloat(document.getElementById("tasa").value);
      const tiempo = parseFloat(document.getElementById("tiempo").value);
      const box = document.getElementById("resultado");

      if (isNaN(capital) || isNaN(tasaPorcentaje) || isNaN(tiempo) || capital < 0 || tasaPorcentaje < 0 || tiempo < 0) {
        box.style.display = "block";
        box.innerHTML = "Por favor ingresa valores numéricos válidos iguales o mayores que cero.";
        return;
      }

      const tasaDecimal = tasaPorcentaje / 100;
      const interes = capital * tasaDecimal * tiempo;
      const montoTotal = capital + interes;

      box.style.display = "block";
      box.innerHTML = `
        <p><strong>Interés generado (I):</strong> ${interes.toFixed(2)}</p>
        <p><strong>Monto total (M = C + I):</strong> ${montoTotal.toFixed(2)}</p>
      `;
    }
  </script>
</body>
</html>
